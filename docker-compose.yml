services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_password_2024}
      POSTGRES_DB: ${DB_NAME:-pos_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos_user} -d ${DB_NAME:-pos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - pos_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pos_user}:${DB_PASSWORD:-pos_password_2024}@postgres:5432/${DB_NAME:-pos_db}?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pos_user}
    volumes:
      - backups_data:/app/backups
      - settings_data:/app/scripts
    networks:
      - pos_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - pos_network

volumes:
  postgres_data:
    name: pos_postgres_data
  backups_data:
    name: pos_backups_data
  settings_data:
    name: pos_settings_data

networks:
  pos_network:
    name: pos_network
    driver: bridge
